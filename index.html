<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexa CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky top bar with tabs, stats strip, then one working view (pipeline / list / meetings) */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --line:#d6dce4;
  --fg:#16202c; --muted:#5d6b7c; --accent:#1f5eff; --accent-fg:#ffffff;
  --ok:#14804a; --warn:#b26a00; --bad:#c23b3b;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --sunk:#1e2731; --line:#2b3643;
  --fg:#e6ebf1; --muted:#93a1b2; --accent:#6d97ff; --accent-fg:#0b1220;
  --ok:#4cc38a; --warn:#e3a33b; --bad:#ef6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --sunk:#1e2731; --line:#2b3643;
  --fg:#e6ebf1; --muted:#93a1b2; --accent:#6d97ff; --accent-fg:#0b1220;
  --ok:#4cc38a; --warn:#e3a33b; --bad:#ef6b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);font:500 14px var(--f-body);padding:6px 10px;border-radius:6px;cursor:pointer}
nav button[aria-current="true"]{background:var(--sunk);color:var(--fg)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--f-body);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 48px;display:grid;gap:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .s{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{min-width:0}
input,select,textarea{font:14px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:80px;resize:vertical}
.tools input{width:220px;max-width:100%}
.tools select{width:auto}
/* pipeline */
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;min-width:min-content}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{margin:0;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;color:var(--muted)}
.col h3 .sum{font-family:var(--f-mono);letter-spacing:0;text-transform:none}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;display:grid;gap:4px}
.card .co{font-weight:600}
.card .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.card .due{font-family:var(--f-mono);font-size:11px}
.due.late{color:var(--bad)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--fg);border:1px solid var(--line)}
.empty-col{font-size:12px;color:var(--muted);padding:6px 2px}
/* table */
.tbl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.st{display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st[data-s="Kontaktad"]::before{background:var(--accent)}
.st[data-s="Möte bokat"]::before{background:var(--warn)}
.st[data-s="Offert"]::before{background:var(--warn)}
.st[data-s="Vunnen"]::before{background:var(--ok)}
.st[data-s="Förlorad"]::before{background:var(--bad)}
/* meetings */
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.mrow .when{font-family:var(--f-mono);font-size:12px}
.mrow.past{opacity:.6}
.mrow .who{min-width:0}
.mrow .who b{display:block}
.mrow .who span{font-size:12px;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
.emptystate{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.emptystate b{color:var(--fg);display:block;font-size:16px;margin-bottom:4px}
.notice{font-size:13px;color:var(--muted)}
/* modal */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.sub h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:30;font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}

.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(360px,100%);display:grid;gap:12px}
.login .brand{font-size:26px}
.err{color:var(--bad);font-size:13px;min-height:1em}
</style>
</head><body>
<div class="login" id="login" hidden><form id="loginForm">
  <div class="brand">Nexa <small>CRM</small></div>
  <label>Mejl<input id="lemail" type="email" autocomplete="username" required></label>
  <label>Lösenord<input id="lpass" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">Logga in</button>
  <div class="err" id="lerr"></div>
</form></div>
<div id="app" hidden>
<header><div class="wrap bar">
  <div class="brand">Nexa <small>CRM</small></div>
  <nav id="tabs">
    <button data-v="pipeline" aria-current="true">Pipeline</button>
    <button data-v="lista">Lista</button>
    <button data-v="moten">Möten</button>
  </nav>
  <div class="spacer"></div>
  <span class="notice" id="who"></span>
  <button class="btn" id="logout">Logga ut</button>
  <button class="btn primary" id="newLead">+ Ny lead</button>
</div></header>

<main class="wrap">
  <section class="stats" id="stats"></section>
  <div class="tools">
    <input id="q" type="search" placeholder="Sök företag, kontakt, mejl…" aria-label="Sök">
    <select id="fOwner" aria-label="Ansvarig"><option value="">Alla ansvariga</option></select>
    <select id="fSvc" aria-label="Tjänst"><option value="">Alla tjänster</option></select>
    <span class="notice" id="sync">Ansluter…</span>
  </div>
  <section id="view"></section>
</main>

</div>
<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body></html>
